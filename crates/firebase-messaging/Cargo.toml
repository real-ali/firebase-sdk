[package]
name = "firebase-messaging"
version = "0.1.0"
edition = "2021"
authors = ["Sayed Ali Sina Hussaini <s.alisinahussaini313@gmail.com>"]
description = "A modern Rust SDK for Firebase Messaging (Firebase Cloud Messaging) to send and manage push notifications."
license = "MIT OR Apache-2.0"
repository = "https://github.com/real-ali/firebase-sdk"
readme = "README.md"
documentation = "https://docs.rs/firebase-messaging"
keywords = ["firebase", "messaging", "push", "notifications", "fcm", "rust"]
categories = ["api-bindings", "network-programming", "web-programming"]

[dependencies]
firebase-core = "0.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
reqwest = { version = "0.11", features = ["json", "gzip", "rustls-tls"] }
tokio = { version = "1.37", features = ["rt-multi-thread", "macros"] }
thiserror = "1.0"
