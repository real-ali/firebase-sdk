[package]
name = "firebase-auth"
version = "0.1.0"
edition = "2021"
authors = ["Sayed Ali Sina Hussaini <s.alisinahussaini313@gmail.com>"]
description = "A Firebase Authentication SDK for Rust, supporting secure sign-in, JWT verification, and user account management."
license = "MIT OR Apache-2.0"
repository = "https://github.com/real-ali/firebase-sdk"
readme = "README.md"
documentation = "https://docs.rs/firebase-auth"
keywords = ["firebase", "auth", "authentication", "jwt", "google"]
categories = ["authentication", "api-bindings", "web-programming"]

[dependencies]
firebase-core = "0.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
reqwest = { version = "0.11", features = ["json", "gzip", "rustls-tls"] }
jsonwebtoken = "9.2"
thiserror = "1.0"
tokio = { version = "1.37", features = ["rt-multi-thread", "macros"] }
